<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F1B16">
<meta name="description" content="sanguapp plan Premium para restaurantes: plano del salón con mesas y mozos, comandas por estación, cuentas, reservas, delivery, stock, costos, caja y reportes.">
<title>sanguapp Premium · Restaurante · Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%232A1E17'/%3E%3Cpath d='M10 22c0-6.5 6.3-10.5 14-10.5S38 15.5 38 22z' fill='%23F2B705'/%3E%3Crect x='10' y='28.5' width='28' height='3.5' rx='1.75' fill='%23E8590C'/%3E%3Cpath d='M10 34.5h28v.5a5 5 0 0 1-5 5H15a5 5 0 0 1-5-5z' fill='%23F2B705'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   sanguapp · DEMO (no guarda nada, todo se reinicia al recargar)
   Los colores de la marca están todos acá arriba.
   ===================================================================== */
:root{
  --ink:#2A1E17; --ink-2:#5A473B; --muted:#8C7B6E;
  --brand:#E8590C; --brand-d:#C44A08; --brand-50:#FFF0E5; --brand-100:#FFD9C2;
  --mostaza:#F2B705; --mostaza-50:#FFF8E1; --mostaza-ink:#7A5B00;
  --bg:#FAF6F1; --line:#EEE4D8; --side:#E9DFD3;
  --ok:#1E9E5A; --ok-bg:#E3F5EA; --low:#B87200; --low-bg:#FFF1D1; --out:#D64545; --out-bg:#FDE6E6;
  --blue:#2F7FD1; --blue-bg:#E6F0FB; --wa:#159A52; --wa-bg:#E2F8EA; --wa-ink:#0E7A3E;
  --r:16px; --g:16px;
  --shadow:0 1px 2px rgba(42,30,23,.05),0 4px 14px rgba(42,30,23,.07);
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font);font-size:15px;line-height:1.4;color:var(--ink);background:var(--side);
  display:grid;grid-template-columns:1fr minmax(0,430px) 1fr;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:default}
p{margin:0}
h1,h2{margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid rgba(232,89,12,.45);outline-offset:2px}

/* ---------- Escritorio: dos columnas vacías y la app al medio ---------- */
.side{background:var(--side)}
.app{position:relative;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 0 1px var(--line),0 0 40px rgba(42,30,23,.10)}
@media (max-width:430px){ body{grid-template-columns:1fr} .side{display:none} .app{box-shadow:none} }

.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.content{padding:var(--g);display:flex;flex-direction:column;gap:14px;padding-bottom:28px}
.bottom{flex:none}

/* ---------- Íconos y utilidades ---------- */
.ic{width:22px;height:22px;flex:none}
.ic-sm{width:16px;height:16px;vertical-align:-3px}
.ic-lg{width:34px;height:34px}
.ic-muted{color:#B9A99B} .ic-brand{color:var(--brand)} .ic-flame{color:#E8672B} .ic-violet{color:#7B61C9} .ic-ok{color:var(--ok)}
.t-ok{color:var(--ok)} .t-out{color:var(--out)} .t-low{color:var(--low)} .t-right{text-align:right}
.muted{color:var(--muted)} .small{font-size:12.5px} .nowrap{white-space:nowrap}
.empty{color:var(--muted);text-align:center;font-size:13.5px;padding:18px 8px}

/* ---------- Encabezado ---------- */
.topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px var(--g)}
.topbar.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.tb-row{display:flex;align-items:center;gap:10px}
.tb-titles{flex:1;min-width:0}
.title{font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.3px}
.title-md{font-size:19px;font-weight:800;line-height:1.2}
.subtitle{color:var(--muted);font-size:12.5px;margin-top:2px}
.topbar.dark .subtitle{color:#CDBBAE}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);margin-left:-4px;flex:none}
.avatar-btn{flex:none;border-radius:50%}
.net{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-bg);padding:4px 9px;border-radius:999px;white-space:nowrap;flex:none}
.net i{width:7px;height:7px;border-radius:50%;background:currentColor}
.net.off{color:var(--low);background:var(--low-bg)}
.explain{display:flex;align-items:center;gap:8px;width:100%;padding:10px var(--g);background:var(--mostaza-50);border-bottom:1px solid #F3E2A6;color:var(--mostaza-ink);font-size:13px;text-align:left}
.explain span{flex:1}

/* ---------- Tarjetas ---------- */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:block;width:100%}
.card.tight{padding:14px}
.tappable{cursor:pointer}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.card-title{font-size:16px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card-head .card-title{margin:0}
.card-title.sm{font-size:14px;margin:0}
.card-note{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}
.eyebrow.light{color:#EBC9AE;margin:0}
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(232,89,12,.55),transparent 70%);pointer-events:none}
.hero-amount{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:2px 0 4px}
.trend{display:inline-block;font-size:12px;font-weight:700;color:#86E3AE;background:rgba(134,227,174,.13);padding:3px 9px;border-radius:999px}
.hero-stats{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:#E5D6CA;position:relative;z-index:1}
.hero-stats b{color:#fff}
.row-card{display:flex;align-items:center;gap:12px;text-align:left}
.row-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--brand-50);color:var(--brand)}
.row-ic.ok{background:var(--ok-bg);color:var(--ok)}
.list-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.list-title{font-weight:700;font-size:14.5px;line-height:1.25}
.list-sub{font-size:12.5px;color:var(--muted);line-height:1.35}
.status-row{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.alert-card{display:flex;align-items:center;gap:12px;background:var(--out-bg);box-shadow:none;border:1px solid #F6C9C9;text-align:left}
.alert-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--out);flex:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big-num{font-size:21px;font-weight:800;margin:8px 0 2px}
.rank{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.rank li{display:flex;gap:6px}
.rank li span{margin-left:auto;color:var(--muted);font-weight:700}
.rank b{color:var(--brand)}
.rank.big{font-size:14.5px;gap:10px}

/* ---------- Gráficos simples (una sola serie, un solo color) ---------- */
.hbars{display:flex;flex-direction:column;gap:12px}
.hb-top{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.hb-track{height:10px;background:var(--bg);border-radius:999px;margin:5px 0 3px;overflow:hidden}
.hb-track span{display:block;height:100%;background:var(--brand);border-radius:999px}
.hb-sub{font-size:11.5px;color:var(--muted)}
.vbars{display:flex;gap:6px;height:180px;padding-top:22px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0;outline:none}
.vb-col{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.vb-bar{position:relative;width:100%;max-width:36px;background:var(--brand-100);border-radius:4px 4px 0 0;transition:background .15s}
.vb.hi .vb-bar{background:var(--brand)}
.vb:hover .vb-bar,.vb:focus .vb-bar{background:var(--brand-d)}
.vb-val{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;font-size:11px;font-weight:700;white-space:nowrap}
.vb-l{font-size:11px;color:var(--muted);border-top:1px solid var(--line);width:100%;text-align:center;padding-top:5px;margin-top:0}
.vb::after{content:attr(data-tip);position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:2}
.vb:hover::after,.vb:focus::after{opacity:1}

/* ---------- Pills, botones, chips ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill-nuevo{background:var(--brand-50);color:var(--brand-d)}
.pill-cocina{background:var(--low-bg);color:var(--low)}
.pill-listo,.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-camino{background:var(--blue-bg);color:var(--blue)}
.pill-entregado,.pill-soft{background:#F1EBE4;color:var(--muted)}
.pill-out{background:var(--out-bg);color:var(--out)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;text-align:center}
.btn.block{display:flex;width:100%}
.btn-sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(232,89,12,.25)}
.btn-primary:active{background:var(--brand-d)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost-dark{background:rgba(255,255,255,.12);color:#fff}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa-soft{background:var(--wa-bg);color:var(--wa-ink)}
.btn:disabled{opacity:.45;box-shadow:none}
.grow{flex:1}
.btn-row{display:flex;gap:10px}
.link-btn{color:var(--brand);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--g));padding:2px var(--g)}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip i{font-style:normal;font-size:11px;background:var(--bg);border-radius:999px;padding:0 6px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on i{background:rgba(255,255,255,.18);color:#fff}

/* ---------- Avatares ---------- */
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.avatar.lg{width:56px;height:56px;font-size:18px}
.avatar.sm{width:32px;height:32px;font-size:12px}

/* ---------- Ingreso ---------- */
.login{padding:26px var(--g) 30px;display:flex;flex-direction:column;gap:14px}
.login-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:8px}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo svg{width:46px;height:46px}
.logo-word{font-size:30px;font-weight:800;letter-spacing:-.5px}
.logo-word b{color:var(--brand)}
.login-shop{color:var(--ink-2);font-weight:600;font-size:14px}
.login-shop span{color:var(--muted);font-weight:500;font-size:12.5px}
.login .explain{border-radius:12px;border:1px solid #F3E2A6}
.who-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.who{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid transparent;text-align:center}
.who:hover{border-color:var(--brand-100)}
.who-name{font-weight:800;font-size:15px}
.who-role{font-size:11.5px;color:var(--muted);line-height:1.2}
.demo-hint{text-align:center;font-size:12px;color:var(--muted)}
.login-links{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.big-link{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px;text-align:left}
.big-link > span:nth-child(2){flex:1;display:flex;flex-direction:column}
.big-link small{color:var(--muted);font-size:12.5px}
.bl-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--mostaza-50);color:var(--mostaza-ink);flex:none}
.bl-web{background:var(--blue-bg);color:var(--blue)}

/* ---------- Vender ---------- */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pbtn{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative;cursor:pointer;border:2px solid transparent;user-select:none}
.pbtn.sel{border-color:var(--brand)}
.pbtn.off{opacity:.5;cursor:default}
.pemoji{font-size:28px;width:48px;height:48px;border-radius:12px;background:var(--brand-50);display:grid;place-items:center}
.pname{font-weight:700;font-size:14px;line-height:1.2}
.pprice{color:var(--muted);font-weight:600;font-size:13px;margin-top:auto}
.pqty{position:absolute;top:10px;right:10px;background:var(--brand);color:#fff;border-radius:999px;min-width:28px;height:28px;padding:0 6px;display:grid;place-items:center;font-weight:800;font-size:14px}
.pminus{position:absolute;bottom:10px;right:10px;width:32px;height:32px;border-radius:10px;background:var(--bg);display:grid;place-items:center}
.pminus .ic{width:18px;height:18px}
.cartbar{display:flex;gap:10px;padding:10px var(--g) calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.mini-ticket{background:var(--bg);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.mini-ticket div{display:flex;justify-content:space-between;gap:10px}
.vuelto{display:flex;justify-content:space-between;align-items:center;background:var(--ok-bg);color:var(--ok);padding:12px 16px;border-radius:14px;font-weight:700}
.vuelto b{font-size:24px}
.note-box{display:flex;gap:10px;align-items:flex-start;background:var(--blue-bg);color:#1F5C99;padding:12px 14px;border-radius:14px;font-size:13px}
.note-box .ic{width:18px;height:18px;margin-top:1px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 0 4px}
.done-check{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin-bottom:6px;box-shadow:0 8px 24px rgba(30,158,90,.3)}
.done-check .ic{width:40px;height:40px;stroke-width:3}
.done-amount{font-size:34px;font-weight:800}
.done-kitchen{display:inline-flex;gap:6px;align-items:center;background:var(--low-bg);color:var(--low);font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;margin-top:4px}
.note-card ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}

/* ---------- Pedidos ---------- */
.order{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px;border-left:5px solid var(--c);display:flex;flex-direction:column;gap:6px}
.order-top{display:flex;align-items:center;gap:8px}
.order-n{font-size:20px;font-weight:800}
.order-time{margin-left:auto;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.order-who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.src{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px}
.src-wa{background:var(--wa-bg);color:var(--wa-ink)} .src-web{background:var(--blue-bg);color:var(--blue)} .src-local{background:#F1EBE4;color:var(--ink-2)}
.order-mode{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.order-items{list-style:none;margin:2px 0;padding:0;font-size:14px;display:flex;flex-direction:column;gap:2px}
.order-items b{color:var(--brand)}
.order-note{font-size:13px;font-weight:700;color:var(--out);background:var(--out-bg);padding:6px 10px;border-radius:10px;display:flex;gap:6px;align-items:center}
.order-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.order-total{display:block;font-size:17px;font-weight:800}
.order-pay{font-size:12px;font-weight:600}
.wa-quote{background:var(--wa-bg);box-shadow:none}
.wa-quote small{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--wa-ink);font-size:12px}
.wa-quote p{margin-top:6px;font-size:14px;font-style:italic}
.known{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok);background:var(--ok-bg);padding:8px 10px;border-radius:10px}
.form{display:flex;flex-direction:column;gap:12px}
.stepper-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:10px;font-weight:800}
.stepper span{width:32px;height:32px;border-radius:10px;background:var(--bg);display:grid;place-items:center}

/* ---------- Cocina ---------- */
.scr-cocina{background:#1E1611}
.kds{background:#fff;border-radius:18px;padding:14px;border-top:8px solid var(--brand)}
.kds.started{border-top-color:var(--mostaza)}
.kds.late{box-shadow:0 0 0 3px var(--out)}
.kds-top{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:600}
.kds-top b{font-size:24px;color:var(--ink)}
.kds-time{margin-left:auto;font-weight:800;color:var(--ink);display:inline-flex;gap:4px;align-items:center;font-size:15px}
.kds.late .kds-time{color:var(--out)}
.kds-state{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:6px;color:var(--brand-d)}
.kds.started .kds-state{color:var(--low)}
.kds-items{list-style:none;margin:8px 0 10px;padding:0;font-size:21px;font-weight:700;line-height:1.3}
.kds-items b{display:inline-block;min-width:32px;color:var(--brand)}
.kds-note{background:var(--out);color:#fff;font-weight:800;padding:8px 12px;border-radius:10px;margin-bottom:8px;font-size:15px}
.kds-drinks{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.kds-btn{min-height:56px;font-size:18px}
.empty-big{color:#E9DCCF;text-align:center;font-size:42px;padding:60px 0}
.empty-big p{font-size:15px;margin-top:8px}

/* ---------- Caja, gastos, fiado ---------- */
.calc-lines{display:flex;flex-direction:column}
.calc-lines > div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.calc-lines > div:last-child{border-bottom:0}
.calc-lines span{display:flex;flex-direction:column}
.calc-lines small{color:var(--muted);font-size:11.5px;font-weight:500}
.calc-lines b{white-space:nowrap}
.calc-lines .total{font-weight:800;font-size:15px;border-top:2px solid var(--ink);border-bottom:0}
.calc-lines .total b{font-size:18px}
.mov{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.mov:last-child{border-bottom:0}
.mov-h{color:var(--muted);font-size:12px;width:40px;flex:none}
.mov-e{font-size:20px;width:38px;height:38px;display:grid;place-items:center;background:var(--bg);border-radius:10px;flex:none}
.mov-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mov-t small{color:var(--muted);font-size:12px}
.mov-t .pill{align-self:flex-start}
.step-n{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);margin-bottom:2px}
.diff{margin-top:10px;padding:12px;border-radius:12px;text-align:center;font-weight:800;font-size:17px}
.diff-ok{background:var(--ok-bg);color:var(--ok)} .diff-out{background:var(--out-bg);color:var(--out)} .diff-low{background:var(--low-bg);color:var(--low)}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qbtn{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:700;text-align:center;min-height:84px}
.qbtn span{font-size:28px}
.fiado{display:flex;flex-direction:column;gap:12px}
.fiado.bad{box-shadow:0 0 0 2px #F6C9C9,var(--shadow)}
.fiado-top{display:flex;align-items:center;gap:12px}
.fiado-amt{font-size:18px;font-weight:800;display:block}

/* ---------- Formularios y hojas ---------- */
.label{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:4px 0 -4px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.field > input{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;font-weight:600;color:var(--ink);background:#fff;outline:none}
.field > input:focus{border-color:var(--brand)}
.money-input{display:flex;align-items:center;gap:6px;width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fff}
.money-input:focus-within{border-color:var(--brand)}
.money-input > span{color:var(--muted);font-weight:800}
.money-input input{border:0;outline:0;flex:1;width:100%;min-height:44px;padding:0;font-size:22px;font-weight:800;background:none}
.money-input.sm{min-height:44px}
.money-input.sm input{font-size:16px;min-height:40px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);padding:5px;border-radius:14px}
.seg button{min-height:44px;border-radius:10px;font-weight:700;font-size:13px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px;line-height:1.15}
.seg button.on{background:#fff;box-shadow:var(--shadow);color:var(--brand-d)}
.seg button span{font-size:18px}
.switch-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0}
.switch-row > span:first-child{flex:1;display:flex;flex-direction:column;font-size:14px}
.switch-row small{color:var(--muted);font-size:12px;font-weight:500}
.switch-row.card{padding:14px 16px}
.switch{width:46px;height:28px;border-radius:999px;background:#D9CFC4;position:relative;flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(18px)}
.sheet-root{position:absolute;inset:0;z-index:50;pointer-events:none}
.sheet-root.open{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(30,18,10,.45);opacity:0;transition:opacity .25s}
.sheet-root.open .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.sheet-root.open .sheet{transform:none}
.handle{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet-x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.sheet-title{font-size:21px;font-weight:800;margin-right:44px}
.sheet-body{display:flex;flex-direction:column;gap:12px}
.wa-chat{background:#ECE5DD;border-radius:16px;padding:14px}
.wa-bubble{background:#DCF8C6;border-radius:12px 12px 2px 12px;padding:10px 12px 20px;font-size:14px;white-space:pre-wrap;position:relative;margin-left:24px;box-shadow:0 1px 1px rgba(0,0,0,.1);line-height:1.4}
.wa-time{position:absolute;right:8px;bottom:4px;font-size:10.5px;color:#5E8A62}
.photo-drop{border:2px dashed var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-2);text-align:center;width:100%}
.photo-drop small{color:var(--muted)}
.qr{width:190px;height:190px;display:block;margin:4px auto}
.qr-steps{margin:0;padding-left:20px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:600;max-width:88%;width:max-content;text-align:center;opacity:0;pointer-events:none;transition:all .25s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Calculadora ---------- */
.ing-list{display:flex;flex-direction:column}
.ing{display:grid;grid-template-columns:1fr 100px 64px;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.ing-main{display:flex;flex-direction:column;min-width:0}
.ing-main b{font-size:13.5px;line-height:1.2}
.ing-main small{font-size:11.5px;color:var(--muted)}
.ing-price{display:flex;align-items:center;gap:3px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;height:38px;background:#fff}
.ing-price span{color:var(--muted);font-size:13px;font-weight:700}
.ing-price input{border:0;outline:0;width:100%;font-weight:700;font-size:14px;background:none;padding:0}
.ing-price:focus-within{border-color:var(--brand)}
.ing-cost{text-align:right;font-size:13.5px}
.two-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.suggest{display:flex;flex-direction:column;align-items:center;background:var(--brand-50);border-radius:14px;padding:14px;margin:12px 0 10px}
.suggest span{font-size:12.5px;font-weight:700;color:var(--brand-d)}
.suggest b{font-size:32px;font-weight:800;color:var(--brand-d);line-height:1.1}
.suggest small{font-size:11.5px;color:var(--muted)}
.your-price{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:14px;padding:12px 14px}
.your-price > div{display:flex;flex-direction:column}
.your-price span{font-size:12px;font-weight:700}
.your-price b{font-size:20px;font-weight:800}
.your-price small{font-size:12px}
.light-ok{background:var(--ok-bg);color:#14713F} .light-low{background:var(--low-bg);color:#7F5000} .light-out{background:var(--out-bg);color:#A82E2E}
.your-price .light-tag{font-size:14px}
.tip{display:flex;gap:8px;font-size:12.5px;color:var(--ink-2);margin-top:10px;align-items:flex-start}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.plight{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.plight:last-child{border-bottom:0}
.plight .t-right{display:flex;align-items:center;gap:6px;font-size:14px}
.pe-sm{font-size:19px;width:34px;height:34px;display:grid;place-items:center;background:var(--bg);border-radius:10px;flex:none}
.pe-md{font-size:24px;width:44px;height:44px;display:grid;place-items:center;background:var(--brand-50);border-radius:12px;flex:none}

/* ---------- Productos, más, equipo, local ---------- */
.list-card{padding:4px 16px}
.prow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .list-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow.off .pe-md,.prow.off .list-main{opacity:.45}
.out-toggle{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
.out-toggle small{font-size:10.5px;font-weight:700;color:var(--muted)}
.out-toggle.on small{color:var(--out)}
.menu-list{padding:0;overflow:hidden}
.menu-row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;border-bottom:1px solid var(--line);text-align:left}
.menu-row:last-child{border-bottom:0}
.mr-ic{width:38px;height:38px;border-radius:11px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;flex:none}
.profile{display:flex;align-items:center;gap:12px}
.member{display:flex;align-items:flex-start;gap:12px}
.perm{font-size:12px;color:var(--ink-2);background:var(--bg);border-radius:8px;padding:4px 8px;margin-top:4px;align-self:flex-start}
.kv{padding:11px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.kv:last-child{border-bottom:0}
.kv small{color:var(--muted);font-size:12px}
.kv.row{flex-direction:row;justify-content:space-between;align-items:center;font-size:14px;gap:10px}
.shop-card{display:flex;align-items:center;gap:14px}
.shop-card > div{display:flex;flex-direction:column}
.shop-card small{color:var(--muted)}
.shop-logo{width:56px;height:56px;border-radius:16px;background:var(--brand-50);display:grid;place-items:center;font-size:30px;flex:none}
.status-card{display:flex;align-items:center;gap:12px;background:var(--ok-bg);box-shadow:none}
.status-card .row-ic{background:#fff;color:var(--ok)}
.status-card.off{background:var(--low-bg)}
.status-card.off .row-ic{color:var(--low)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts div{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.facts small{font-size:11.5px;color:var(--muted)}
.facts b{font-size:15px}

/* ---------- Guía de funciones ---------- */
.intro p{margin-bottom:12px;font-size:14px}
.cast{display:flex;flex-direction:column;gap:8px}
.cast > span{display:flex;align-items:center;gap:10px}
.cast > span > span{display:flex;flex-direction:column;line-height:1.2}
.cast small{color:var(--muted);font-size:12px}
.gitem{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.gitem summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.gitem summary::-webkit-details-marker{display:none}
.gico{width:42px;height:42px;border-radius:12px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;flex:none}
.gchev{color:#B9A99B;transition:transform .2s;display:flex}
.gitem[open] .gchev{transform:rotate(90deg)}
.gitem[open] summary{border-bottom:1px solid var(--line)}
.gbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.who-chips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{font-size:11.5px;font-weight:700;background:var(--bg);border:1px solid var(--line);padding:3px 9px;border-radius:999px;color:var(--ink-2)}
.g-what{font-size:14.5px;font-weight:600}
.g-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--brand)}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;position:relative;padding-left:36px;font-size:14px;line-height:1.45}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center}
.g-why{display:flex;gap:8px;background:var(--ok-bg);color:#14592F;border-radius:12px;padding:10px 12px;font-size:13.5px;align-items:flex-start}
.g-why .ic{margin-top:2px}
.next-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.next-list li{display:flex;flex-direction:column;padding-left:12px;border-left:3px solid var(--mostaza);font-size:14px}
.next-list small{color:var(--muted);font-size:12.5px}

/* ---------- Menú online (lo que ve el cliente) ---------- */
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--ink);color:#fff;font-size:12.5px;position:sticky;top:0;z-index:6}
.demo-bar button{display:inline-flex;align-items:center;gap:4px;font-weight:700;padding:6px 10px;background:rgba(255,255,255,.12);border-radius:999px;flex:none}
.url{display:inline-flex;align-items:center;gap:4px;color:#D8C8BB;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.m-cover{height:120px;background:linear-gradient(135deg,#E8590C,#C2410C 60%,#9A3412);display:grid;place-items:center}
.m-cover-art{font-size:44px;letter-spacing:10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.m-head{background:#fff;padding:0 var(--g) 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.m-logo{width:72px;height:72px;border-radius:20px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:38px;margin-top:-36px;border:3px solid #fff}
.m-head h1{font-size:21px;margin-top:6px;font-weight:800}
.m-open{color:var(--ok);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.m-open i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.m-info{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:4px}
.m-info span{display:inline-flex;align-items:center;gap:4px}
.m-chips{margin:0;padding:12px var(--g);background:var(--bg);position:sticky;top:44px;z-index:5}
.m-list{padding:0 var(--g) 20px;display:flex;flex-direction:column;gap:12px}
.m-item{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;gap:12px;align-items:center}
.m-item .list-main b{font-size:15px}
.m-item small{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m-price{font-weight:800;margin-top:4px}
.m-item.off{opacity:.55}
.m-item.off .m-price{color:var(--out);font-size:13px}
.m-thumb{width:88px;height:88px;border-radius:14px;background:var(--brand-50);display:grid;place-items:center;font-size:42px;position:relative;flex:none;margin-bottom:6px}
.m-add{position:absolute;right:-6px;bottom:-6px;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(232,89,12,.4)}
.m-add .ic{width:20px;height:20px}
.m-qty{position:absolute;left:50%;transform:translateX(-50%);bottom:-12px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;box-shadow:var(--shadow);padding:3px;font-size:14px}
.m-qty button{width:28px;height:28px;border-radius:50%;background:var(--brand-50);color:var(--brand-d);display:grid;place-items:center}
.m-foot{text-align:center;font-size:11.5px;color:var(--muted);padding:6px 0 24px}
.track{list-style:none;margin:6px 0 10px;padding:0;display:flex;flex-direction:column}
.track li{position:relative;padding:0 0 18px 34px;display:flex;flex-direction:column}
.track li::before{content:'';position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;border:3px solid var(--line);background:#fff}
.track li::after{content:'';position:absolute;left:9px;top:22px;bottom:2px;width:2px;background:var(--line)}
.track li:last-child::after{display:none}
.track li.on::before{background:var(--ok);border-color:var(--ok)}
.track li.next::before{border-color:var(--mostaza);animation:pulse 1.4s infinite}
.track small{color:var(--muted);font-size:12px}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(242,183,5,.25)}}

/* ---------- Barra de abajo ---------- */
.tabbar{display:flex;align-items:flex-end;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-height:50px;justify-content:center}
.tab.on{color:var(--brand)}
.tab-sell{flex:1.1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--brand-d);margin-top:-28px}
.sell-circle{width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(232,89,12,.4);border:4px solid #fff}
.sell-circle .ic{width:26px;height:26px;stroke-width:2.6}

/* ---------- Betas: plan, armado tucumano, mesas, menú y mapa ---------- */
.plan-badge{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--mostaza-50);color:var(--mostaza-ink);border:1px solid #F3E2A6}
.plan-badge.emp{background:var(--ink);color:#fff;border-color:var(--ink)}
.explain.round{border-radius:12px;border:1px solid #F3E2A6}
.steps-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px var(--g);background:#fff;border-bottom:1px solid var(--line)}
.sb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;border-radius:10px;text-align:center}
.sb b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--line);font-size:12px;color:var(--ink-2)}
.sb.on{color:var(--brand-d)} .sb.on b{background:var(--brand);border-color:var(--brand);color:#fff}
.sb.done b{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.sb:disabled{opacity:.45}
.mesas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mesa{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.mesa b{font-size:13px} .mesa small{font-size:11px;color:var(--muted)}
.mesa.busy{background:var(--brand-50);border-color:var(--brand)} .mesa.busy small{color:var(--brand-d);font-weight:700}
.base-card{display:flex;gap:12px;align-items:flex-start}
.base-card.off{opacity:.55}
.size-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.size-btn{border:1.5px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;background:#fff}
.size-btn span{font-size:12px;font-weight:700;color:var(--muted)} .size-btn b{font-size:15px}
.size-btn:hover,.size-btn.on{border-color:var(--brand);background:var(--brand-50)}
.chosen{display:flex;align-items:center;gap:12px;background:var(--brand-50);box-shadow:none;border:1.5px solid var(--brand-100)}
.combo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:2px dashed #E8C766;background:var(--mostaza-50)}
.combo small{display:block;color:var(--muted);font-size:12px}
.combo.on{border-style:solid;border-color:var(--brand);background:var(--brand-50)}
.combo-star{font-size:24px}
.qty-row{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;border:1.5px solid var(--line)}
.line-sum{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.line-sum span{display:flex;flex-direction:column} .line-sum small{font-weight:500;color:var(--muted);font-size:12px}
.line-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.line-note{color:var(--out);font-weight:700;font-size:12.5px}
.icon-x{width:30px;height:30px;border-radius:8px;background:var(--bg);display:grid;place-items:center;flex:none}
.order-items small{display:block;color:var(--muted);font-size:12.5px;margin-left:24px}

  if (t.shape === 'stool') return [10, 10];
  if (t.shape === 'round') { const w = t.seats <= 2 ? 16 : t.seats <= 4 ? 19 : 23; return [w, w]; }
  if (t.shape === 'square') { const w = t.seats <= 2 ? 15 : 19; return [w, w]; }

function chairs(t) {
  const n = t.seats, out = [];
  if (t.shape === 'stool') return out;
  if (t.shape === 'round') {
    for (let i = 0; i < n; i++) { const deg = -90 + i * 360 / n, a = deg * Math.PI / 180; out.push([50 + 43 * Math.cos(a), 50 + 43 * Math.sin(a), deg + 90]); }
    return out;
  }
  const side = t.shape === 'square' ? (n > 2 ? 1 : 0) : 1, top = t.shape === 'square' ? 1 : Math.max(1, Math.ceil((n - 2) / 2));
  for (let k = 0; k < top; k++) { const x = 25 + 50 * (k + .5) / top; out.push([x, 6, 0]); out.push([x, 94, 180]); }
  if (side) { out.push([5, 50, 270]); out.push([95, 50, 90]); }
  return out.slice(0, n);
}

/* ---------- Cocina por estación ---------- */
function kdsTickets(station) {
  const T = [], push = (key, src, who, items) => {
    const by = {};
    items.filter(i => i.st === 'cocina').forEach(i => { const stn = dish(i.d).st; if (station === 'all' || stn === station) (by[stn] = by[stn] || []).push(i); });
    Object.entries(by).forEach(([stn, its]) => T.push({ key: key + '|' + stn, src, who, stn, items: its, at: Math.min(...its.map(i => i.at)), started: its.every(i => i.started) }));
  };
  openTables().forEach(t => push(t.id, tName(t), 'Mozo: ' + user(SESS[t.id].mozo).name, live(SESS[t.id])));
  DEL.filter(o => o.st === 'cocina').forEach(o => push(o.id, 'Delivery ' + o.id, o.name, o.items));
  return T.sort((a, b) => a.at - b.at);
}

const FOOD = () => CARTA.filter(d => d.course >= 1);
function matrixSVG() {

  const maxX = Math.max(...ds.map(d => d.sold)) * 1.1, maxY = Math.max(...ds.map(d => d.price - d.cost)) * 1.1;
  const X = v => 30 + v / maxX * 300, Y = v => 250 - v / maxY * 230;
  return `<svg class="matrix" viewBox="0 0 340 280" role="img" aria-label="Platos según ventas y ganancia">
    <rect x="${X(mx)}" y="20" width="${330 - X(mx)}" height="${Y(my) - 20}" fill="#DCFCE7"/><rect x="30" y="20" width="${X(mx) - 30}" height="${Y(my) - 20}" fill="#E0F2FE"/>
    <rect x="${X(mx)}" y="${Y(my)}" width="${330 - X(mx)}" height="${250 - Y(my)}" fill="#FEF3C7"/><rect x="30" y="${Y(my)}" width="${X(mx) - 30}" height="${250 - Y(my)}" fill="#FEE2E2"/>
    <text x="325" y="34" text-anchor="end" class="mq">⭐ Estrellas</text><text x="36" y="34" class="mq">🧩 Rompecabezas</text><text x="325" y="244" text-anchor="end" class="mq">🐴 Caballitos</text><text x="36" y="244" class="mq">🐶 Perros</text>
    <line x1="30" y1="250" x2="330" y2="250" class="ax"/><line x1="30" y1="20" x2="30" y2="250" class="ax"/>
    <text x="180" y="270" text-anchor="middle" class="al">Más vendidos →</text><text x="12" y="135" text-anchor="middle" class="al" transform="rotate(-90 12 135)">Más ganancia →</text>
    ${ds.map(d => `<g><circle cx="${X(d.sold)}" cy="${Y(d.price - d.cost)}" r="5"/><text x="${X(d.sold) + 7}" y="${Y(d.price - d.cost) + 4}" class="dl">${d.name.split(' ')[0]}</text></g>`).join('')}</svg>`;
}
function quadOf(d) {
  const ds = FOOD(), mx = ds.reduce((a, x) => a + x.sold, 0) / ds.length, my = ds.reduce((a, x) => a + (x.price - x.cost), 0) / ds.length;
  return d.sold >= mx ? (d.price - d.cost >= my ? 'estrella' : 'caballo') : (d.price - d.cost >= my ? 'rompe' : 'perro');
}
const QUADS = { estrella: ['⭐ Estrellas', 'Se venden mucho y dejan mucho. Cuidarlos: que nunca falten.'], caballo: ['🐴 Caballitos', 'Se venden mucho pero dejan poco. Subirles un poco el precio o achicar el costo.'], rompe: ['🧩 Rompecabezas', 'Dejan mucho pero se venden poco. Que los mozos los recomienden.'], perro: ['🐶 Perros', 'Se venden poco y dejan poco. Pensar en sacarlos de la carta.'] };

      <p class="eyebrow">Todos los platos</p><section class="card list-card">${CARTA.map(x => { const p = foodCost(x); return `<div class="bl"><span>${x.name}<small>Costo ${money(x.cost)} · precio ${money(x.price)}</small></span><b>${LIGHTS[fcLight(p)].e} ${p} %</b></div>`; }).join('')}</section>`;

}

function opBody() {
  const T = ui.opTab;
  if (T === 'apertura' || T === 'cierre') { const L = CHECKS[T], done = L.filter(c => c[1]).length;
    return `<div class="progress"><i style="width:${done / L.length * 100}%"></i></div><p class="small muted">${done} de ${L.length} listas</p>
      <section class="card list-card">${L.map(([t, by], i) => `<button class="check-row ${by ? 'done' : ''}" data-action="check" data-l="${T}" data-i="${i}"><span class="cbox">${by ? icon('check', 'ic-sm') : ''}</span><span class="list-main"><b class="list-title">${t}</b><span class="list-sub">${by ? 'Hecho por ' + by : 'Pendiente'}</span></span></button>`).join('')}</section>`; }
  if (T === 'temps') return `<p class="small muted">Anotá la temperatura de cada heladera. Si sale del rango, queda en rojo y le avisa a la dueña.</p>
    ${TEMPS.map(h => { const bad = h.last > h.max || h.last < h.min; return `<section class="card temp ${bad ? 'bad' : ''}"><div class="card-head"><h2 class="card-title">${icon('thermo', bad ? 'ic-out' : 'ic-ok')} ${h.name}</h2><b class="temp-v">${String(h.last).replace('.', ',')} °C</b></div>
      <p class="small muted">Tiene que estar entre ${h.min} y ${h.max} °C · última lectura ${h.at}</p>
      <div class="btn-row" style="margin-top:8px"><input type="text" inputmode="decimal" class="temp-in" data-temp="${h.id}" placeholder="Nueva lectura en °C" aria-label="Nueva lectura de ${h.name}"><button class="btn btn-sm btn-primary" data-action="saveTemp" data-id="${h.id}">Anotar</button></div></section>`; }).join('')}`;
  return `<section class="card list-card">${TAREAS.map(m => `<div class="bl"><span>${icon('wrench', 'ic-sm')} ${esc(m.t)}<small>${m.every} · ${m.due}</small></span>${m.st === 'hecha' ? pill('ok', 'Hecha ✓') : `<button class="btn btn-sm ${m.st === 'vencida' ? 'btn-primary' : 'btn-ghost'}" data-action="taskDone" data-id="${m.id}">${m.st === 'vencida' ? 'Vencida · hacer' : 'Hecha'}</button>`}</div>`).join('')}</section>`;

function delCard(o, cadete) {
  const [l, c] = DEL_ST[o.st];
  const btn = cadete ? (o.st === 'listo' ? `<button class="btn btn-primary block" data-action="cadPick" data-id="${o.id}">${icon('bag')} Lo retiré del local</button>`

    : ({ nuevo: `<button class="btn btn-sm btn-primary" data-action="delAccept" data-id="${o.id}">Aceptar y mandar a cocina</button>`, cocina: `<button class="btn btn-sm btn-dark" data-action="delReady" data-id="${o.id}">Marcar listo</button>`, listo: `<button class="btn btn-sm btn-dark" data-action="cadPick" data-id="${o.id}">Salió con Pato</button>`, camino: `<button class="btn btn-sm btn-ghost" data-action="cadDone" data-id="${o.id}">Entregado</button>` })[o.st] || '';

    <ul class="order-items">${o.items.map(i => `<li><b>${i.q}×</b> ${dish(i.d).name}${modsText(i) ? `<small>${modsText(i)}</small>` : ''}${i.note ? `<em>📝 ${esc(i.note)}</em>` : ''}</li>`).join('')}</ul>
    ${o.notes ? `<p class="order-note">${icon('alert', 'ic-sm')} ${esc(o.notes)}</p>` : ''}
    <div class="order-foot"><div><b class="order-total">${money(delTotal(o))}</b><span class="order-pay ${o.paid ? 't-ok' : 't-low'}">${o.paid ? '✓ ' : ''}${esc(o.pay)}</span></div>${cadete ? '' : btn}</div>

}

    if (!C.name.trim() || !C.phone.trim()) return toast('Completá tu nombre y tu teléfono');
    if (C.km == null) return toast('Marcá tu casa en el mapa (o elegí una dirección de ejemplo)');
    if (!zoneFor(C.km)) return toast('Estás fuera de la zona de reparto');
    const o = { id: 'D' + ui.nextDel++, code: orderCode(), name: C.name, phone: C.phone, addr: C.addr || 'Marcada en el mapa', ref: C.ref, lat: C.lat, lng: C.lng, km: kmFmt(C.km), ship: shipCost(),
      items: ui.mlines.map(l => IT(l.d, { q: l.q, mods: l.mods, note: l.note, st: 'espera', ago: 0 })), pay: C.pay === 'transferencia' ? 'Transferencia · falta el comprobante' : 'Efectivo al recibir', paid: false, notes: C.notes.trim(), st: 'nuevo', at: Date.now() };
    DEL.unshift(o); ui.sent = { o, text: delText(o) }; ui.mlines = []; ui.sheet = null; nav('delOk');
  },
  seeDel: () => { ui.user = user('laura'); nav('pedidosDel'); toast('Ahora estás viendo como Laura (encargada)'); },
  delAccept: d => { const o = DEL.find(x => x.id === d.id); o.st = 'cocina'; o.items.forEach(i => { i.st = 'cocina'; i.at = Date.now(); }); render(true); toast(`#${o.id} a la cocina`); },
  delReady: d => { const o = DEL.find(x => x.id === d.id); o.st = 'listo'; o.items.forEach(i => { if (i.st === 'cocina') i.st = 'listo'; }); render(true); },
  cadPick: d => { const o = DEL.find(x => x.id === d.id); o.st = 'camino'; o.cadete = 'Pato'; render(true); toast(`#${o.id} en camino`); },
  cadDone: d => { const o = DEL.find(x => x.id === d.id), cash = !o.paid; o.st = 'entregado'; o.paid = true; ui.cadDone = (ui.cadDone || 0) + 1; render(true); toast(`#${o.id} entregado${cash ? ' · cobraste ' + money(delTotal(o)) : ''} ✓`); },
  cadWa: d => { const o = DEL.find(x => x.id === d.id); openWa(`¡Hola ${o.name.split(' ')[0]}! Soy Pato, de ${SHOP.name} 🛵 Llego con tu pedido #${o.id} en 5 minutos.${o.paid ? '' : ` Son ${money(delTotal(o))} en efectivo.`}`, 'Avisarle que llegás', o.name); },
  // Administración
  clock: d => { ui.clock = d.v; render(true); toast('Así se ve la carta: ' + CLOCKS[d.v]); },
  hhToggle: () => { HH.on = !HH.on; render(true); },
  hhPct: d => { HH.pct = +d.v; render(true); },
  stockTab: d => { ui.stockTab = d.v; render(); },
  saveCount: () => { let n = 0; Object.entries(ui.count).forEach(([id, v]) => { if (v !== '' && v != null) { INSUMOS.find(i => i.id === id).stock = Number(String(v).replace(',', '.')) || 0; n++; } }); ui.count = {}; render(true); toast(n ? `Conteo guardado: ${n} insumos actualizados` : 'No cargaste ningún conteo'); },
  mermaItem: d => { ui.sheet.item = d.v; renderSheet(); },
  mermaWhy: d => { ui.sheet.why = d.v; renderSheet(); },
  saveMerma: () => { const X = ui.sheet, i = INSUMOS.find(x => x.id === X.item); if (!i || !X.why) return toast('Elegí el insumo y el motivo'); MERMAS.unshift({ at: 'Hoy ' + timeNow(), item: i.name, q: X.q || '1 ' + i.unit, why: X.why, who: ui.user.name, cost: Math.round(i.cost * (Number(String(X.q || '1').replace(',', '.').replace(/[^\d.]/g, '')) || 1)) }); closeSheet(); render(true); },
  costTab: d => { ui.costTab = d.v; render(); },
  ficha: d => { ui.ficha = d.v; render(true); },
  cajaTab: d => { ui.cajaTab = d.v; render(); },
  payProv: d => { const p = PAGOS.find(x => x.id === d.id); p.st = 'pagado'; p.due = 'Pagado hoy'; render(true); toast(`Pagado: ${p.prov} ${money(p.amt)}`); },
  closeCaja: () => { const v = ui.sheet.cnt; if (v == null || v === '') return toast('Poné cuánto contaste'); closeSheet(); toast(`${ui.sheet ? '' : 'Caja cerrada'} · el cierre le llegó a Valentina`); },
  factTab: d => { ui.factTab = d.v; render(); },
  notaCredito: d => { const f = FACT[+d.i]; FACT.unshift({ n: 'NC 0003-' + String(40 + FACT.length).padStart(8, '0'), type: 'NC', to: f.to, mesa: 'Anula ' + f.n, total: -f.total, cae: '7524' + String(Math.floor(Math.random() * 1e10)).padStart(10, '0'), at: 'Hoy ' + timeNow() }); render(true); toast('Nota de crédito emitida (demo)'); },
  repPeriod: d => { ui.repPeriod = d.v; render(true); },
  opTab: d => { ui.opTab = d.v; render(); },
  check: d => { const c = CHECKS[d.l][+d.i]; c[1] = c[1] ? null : `${ui.user.name} ${timeNow()}`; render(true); },
  saveTemp: d => { const h = TEMPS.find(x => x.id === d.id), inp = $(`[data-temp="${d.id}"]`), v = Number(String(inp ? inp.value : '').replace(',', '.')); if (!inp || inp.value === '' || isNaN(v)) return toast('Poné la temperatura'); h.last = v; h.at = timeNow(); render(true); toast(v > h.max || v < h.min ? 'Fuera de rango: le llegó el aviso a la dueña' : 'Anotado ✓'); },
  taskDone: d => { TAREAS.find(x => x.id === d.id).st = 'hecha'; render(true); },
  alertGo: d => { const [k, v] = d.v.split(':'); if (k === 'mesa') { ui.mesa = v; ui.mesaTab = 'comanda'; return nav('mesa'); } if (k === 'go') return nav(v); openSheet({ type: 'audit' }); },
};
function doAction(t) {
  const X = ui.action, from = tableOf(X.from), tm = mainOf(t);
  if (tm.id === from.id) return toast('Elegí otra mesa');
  if (X.type === 'mover') {
    if (SESS[tm.id] && !SESS[tm.id].clean) return toast('Esa mesa está ocupada: elegí una libre');
    SESS[tm.id] = SESS[from.id]; SESS[from.id] = SS({ clean: true }); tm.mozo = SESS[tm.id].mozo;
    RES.filter(r => r.table === from.id && r.st === 'sentada').forEach(r => { r.table = tm.id; });
    ui.action = null; ui.mesa = tm.id; nav('mesa', false); return toast(`Pasaron a la ${tName(tm)}`);
  }
  const s = SESS[from.id], o = SESS[tm.id];
  if (o && !o.clean) { s.items.push(...o.items); s.covers += o.covers; }
  delete SESS[tm.id]; tm.join = from.id; ui.action = null; ui.mesa = from.id; nav('mesa', false); toast(`${tName(from)} y ${tName(tm)} unidas con una sola cuenta`);
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e => { const el = e.target.closest('[data-action]'); if (!el || el.disabled) return; const fn = A[el.dataset.action]; if (fn) fn(el.dataset, el); });
document.addEventListener('keydown', e => { const el = e.target; if ((e.key === 'Enter' || e.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button' && el.dataset.action) { e.preventDefault(); el.click(); } if (e.key === 'Escape' && ui.sheet) A.closeSheet(); });
document.addEventListener('input', e => {
  const t = e.target, ds = t.dataset;
  if (ds.count !== undefined) { ui.count[ds.count] = t.value; const i = INSUMOS.find(x => x.id === ds.count), el = $('#dif-' + ds.count), dif = t.value === '' ? null : Number(t.value.replace(',', '.')) - i.stock; if (el) { el.textContent = dif === null || isNaN(dif) ? '—' : (dif > 0 ? '+' : '') + qtyFmt(dif); el.className = 'dif ' + (dif === null ? '' : dif < 0 ? 't-out' : dif > 0 ? 't-low' : 't-ok'); } }
  else if (ds.pin !== undefined) ui.sheet.pin = t.value;
  else if (ds.rf !== undefined) ui.sheet[ds.rf] = t.value;
  else if (ds.mnote !== undefined) ui.sheet.note = t.value;
  else if (ds.mc !== undefined) ui.mc[ds.mc] = t.value;
  else if (ds.cuit !== undefined) ui.sheet.cuit = t.value;
  else if (ds.rs !== undefined) ui.sheet.rs = t.value;
  else if (ds.cnt !== undefined) { ui.sheet.cnt = t.value; const k = TURNOS[1].cajas.find(x => x.name === ui.sheet.kind), dif = t.value === '' ? null : num(t.value) - k.esperado, el = $('#cnt-dif'); if (el) el.innerHTML = dif === null ? '' : `<div class="diff diff-${dif === 0 ? 'ok' : dif < 0 ? 'out' : 'low'}">${dif === 0 ? '¡Justo!' : dif < 0 ? 'Faltan ' + money(-dif) : 'Sobran ' + money(dif)}</div>`; }
});
// Arrastrar mesas y objetos en el modo "Editar plano"
document.addEventListener('pointerdown', e => {
  if (ui.screen !== 'salon' || ui.mode !== 'edit') return;
  const el = e.target.closest('.tb, .dc'); if (!el) return;
  const isT = el.classList.contains('tb'), id = isT ? el.dataset.tid : el.dataset.did, obj = isT ? tableOf(id) : DECOR.find(x => x.id === id);
  ui.drag = { el, obj, board: $('#board').getBoundingClientRect(), sx: e.clientX, sy: e.clientY, ox: obj.x, oy: obj.y, moved: false };
  if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', e => {
  const D = ui.drag; if (!D) return;
  const dx = (e.clientX - D.sx) / D.board.width * 100, dy = (e.clientY - D.sy) / D.board.height * 100;
  if (Math.abs(dx) + Math.abs(dy) > 1) D.moved = true;
  D.obj.x = Math.round(Math.max(4, Math.min(96, D.ox + dx)) * 10) / 10; D.obj.y = Math.round(Math.max(4, Math.min(96, D.oy + dy)) * 10) / 10;
  D.el.style.left = D.obj.x + '%'; D.el.style.top = D.obj.y + '%'; D.el.classList.add('dragging');
});
document.addEventListener('pointerup', () => { const D = ui.drag; if (!D) return; ui.drag = null; if (D.moved) { ui.justDragged = true; ui.sel = D.obj.id; setTimeout(() => { ui.justDragged = false; }, 60); render(true); } });

/* ---------- Arranque ---------- */
// Reservas hechas en la página web del restaurante (sitio.html), si el navegador las comparte
try {
  const web = JSON.parse(localStorage.getItem('anima_reservas') || '[]'), today = new Date(); today.setHours(0, 0, 0, 0);
  web.forEach((w, i) => { const d = Math.round((new Date(w.date + 'T00:00') - today) / 86400000); if (d === 0 || d === 1) RES.push({ id: 'web' + i, day: d, time: w.time, name: w.name, pax: +w.pax, tel: w.tel || '', src: 'web', st: 'pendiente', table: null, occ: w.occ || '', notes: w.notes || '', isNew: true }); });
} catch (e) { /* sin acceso al almacenamiento: no pasa nada */ }
setInterval(() => { if (!ui.sheet && !ui.drag && ['salon', 'mesa', 'mozo', 'kds', 'tv', 'inicio', 'pedidosDel', 'reparto'].includes(ui.screen) && !document.activeElement.matches('input')) render(true); }, 30000);
render();
// Entrada directa desde la página web: #delivery, #qrMesa o #tv
const startHash = location.hash.slice(1);
if (['delivery', 'qrMesa', 'tv'].includes(startHash)) nav(startHash);
</script>
